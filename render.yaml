services:
  - type: web
    name: smart-parking-system
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python manage.py seed_data && gunicorn smart_parking.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "True"
