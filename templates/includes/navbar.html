<header class="app-navbar d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-3">
        <!-- Mobile Sidebar Toggle -->
        <button class="btn btn-sm btn-outline-secondary d-lg-none" id="sidebarToggle" type="button"
            aria-label="Toggle navigation">
            <i class="bi bi-list fs-5"></i>
        </button>
        <span class="d-none d-sm-inline fw-semibold text-secondary">
            <i class="bi bi-geo-alt-fill text-primary me-1"></i> Smart Parking System
        </span>
    </div>

    <!-- Right Side Actions & User Info -->
    <div class="d-flex align-items-center gap-3">
        <a href="{% url 'parking_slots' %}"
            class="btn btn-sm btn-outline-primary d-none d-md-inline-flex align-items-center gap-1">
            <i class="bi bi-grid-3x3-gap"></i> View Live Slots
        </a>

        <!-- User Dropdown -->
        <div class="dropdown">
            <button class="btn user-badge dropdown-toggle border-0" type="button" data-bs-toggle="dropdown"
                aria-expanded="false">
                <i class="bi bi-person-circle fs-5 text-primary"></i>
                <span class="d-none d-sm-inline">{{ user.first_name|default:user.username }}</span>
                {% if user.profile.role == 'ADMIN' or user.is_superuser %}
                <span class="role-pill role-admin">Admin</span>
                {% elif user.profile.role == 'STAFF' %}
                <span class="role-pill role-staff">Staff</span>
                {% else %}
                <span class="role-pill role-customer">Driver</span>
                {% endif %}
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2">
                <li class="px-3 py-2 border-bottom">
                    <div class="fw-bold text-dark">{{ user.get_full_name|default:user.username }}</div>
                    <div class="small text-muted">{{ user.email|default:"No email" }}</div>
                </li>
                <li><a class="dropdown-item py-2" href="{% url 'profile' %}"><i class="bi bi-person me-2"></i> My
                        Profile</a></li>
                <li><a class="dropdown-item py-2" href="{% url 'vehicle_list' %}"><i class="bi bi-car-front me-2"></i>
                        My Vehicles</a></li>
                <li><a class="dropdown-item py-2" href="{% url 'booking_list' %}"><i
                            class="bi bi-calendar-check me-2"></i> My Bookings</a></li>
                <li>
                    <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item py-2 text-danger" href="{% url 'logout' %}"><i
                            class="bi bi-box-arrow-right me-2"></i> Log Out</a></li>
            </ul>
        </div>
    </div>
</header>
