{% extends 'base.html' %}

{% block title %}Confirm Delete - Admin Dashboard{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="content-card text-center py-4">
            <div class="mb-3 text-danger">
                <i class="bi bi-trash3-fill display-4"></i>
            </div>
            <h4 class="fw-bold text-dark mb-2">Confirm Deletion</h4>
            <p class="text-muted mb-4">
                Are you sure you want to delete <strong>{{ object_name }}</strong>?
                <br>
                <small class="text-danger mt-1 d-block">This action cannot be undone.</small>
            </p>

            <form method="POST">
                {% csrf_token %}
                <div class="d-flex justify-content-center gap-3">
                    <a href="{% url cancel_url %}" class="btn btn-light border px-4">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="bi bi-trash me-1"></i> Delete
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
